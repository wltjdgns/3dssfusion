name: kinect_det
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.14
  - pip=24.0
  - numpy=1.26.4
  - scipy=1.13.1
  - scikit-learn=1.5.1
  - matplotlib=3.9.2
  - pandas=2.2.2
  - pyyaml=6.0.2
  - tqdm=4.66.5
  - rich=13.8.1
  - loguru=0.7.2
  - psutil=6.0.0

  - pip:
    # PyTorch: pip wheels are self-contained (DLLs bundled), avoiding Windows libiomp5md ordinal mismatch with conda builds
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.1.2+cu118
    - torchvision==0.16.2+cu118
    - torchaudio==2.1.2+cu118
    # Pillow via pip for DLL self-containment on Windows (avoids conda Library/bin activation requirement)
    - pillow==10.4.0
    # opencv-python-headless: supervision==0.23.0 requires headless variant; <=4.9.0.80 satisfies sahi constraint
    - opencv-python-headless==4.9.0.80
    - ultralytics==8.3.40
    - supervision==0.23.0
    - transformers==4.47.1
    - timm==1.0.9
    - open3d==0.18.0
    - spconv-cu118==2.3.6
    - ensemble-boxes==1.0.9
    - lap==0.5.12
    - einops==0.8.0
    - omegaconf==2.3.0
    - shapely==2.0.6
    - onnxruntime-gpu==1.18.1
    - nvidia-ml-py==13.595.45
    # sahi deps (installed separately since sahi itself conflicts with opencv-python-headless)
    - pybboxes==0.1.6
    - terminaltables

# ============================================================
# Post-install steps (run after: conda env create -f environment.yml)
# ============================================================
# 1. sahi (requires opencv-python which conflicts with opencv-python-headless; --no-deps bypasses this):
#    pip install sahi==0.11.19 --no-deps
#
# 2. groundingdino-py (requires supervision==0.6.0 which conflicts; also needs UTF-8 for Windows README parse):
#    Windows PowerShell:
#      $env:PYTHONUTF8=1; pip install groundingdino-py==0.4.0 --no-deps
#
# 3. pyk4a (Azure Kinect SDK wrapper; requires MSVC Build Tools + Azure Kinect SDK v1.4.1 installed):
#    Prerequisites: VS Build Tools 2022+ at C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\
#                   Azure Kinect SDK v1.4.1 at C:\Program Files\Azure Kinect SDK v1.4.1\
#    Windows CMD:
#      call "C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
#      set DISTUTILS_USE_SDK=1 && set MSSdk=1
#      pip install git+https://github.com/etiennedub/pyk4a.git@1.5.0
# ============================================================
